<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sude Melek Nur - Doğum Günü Sayacı 🎀</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Quicksand', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffd1dc 0%, #ffb6c1 50%, #ff9eb5 100%);
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    position: relative;
  }

  /* Yüzen kalpler ve fiyonklar */
  .floating {
    position: fixed;
    top: -50px;
    font-size: 24px;
    animation: floatDown linear infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes floatDown {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 2px solid rgba(255, 255, 255, 0.7);
    border-radius: 35px;
    padding: 40px 30px;
    max-width: 600px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255, 105, 140, 0.3);
    animation: popIn 0.8s ease-out;
  }
  @keyframes popIn {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .kitty {
    width: 160px;
    height: 160px;
    margin: 0 auto 15px;
    animation: bounce 3s ease-in-out infinite;
    filter: drop-shadow(0 8px 15px rgba(255, 105, 140, 0.4));
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-15px) rotate(3deg); }
  }

  h1 {
    font-family: 'Pacifico', cursive;
    font-size: 2.6rem;
    color: #e91e63;
    text-shadow: 2px 2px 0 #fff, 4px 4px 10px rgba(233, 30, 99, 0.3);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .subtitle {
    color: #c2185b;
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 25px;
  }
  .subtitle span {
    background: #fff;
    padding: 4px 14px;
    border-radius: 20px;
    display: inline-block;
    margin: 0 3px;
    box-shadow: 0 3px 8px rgba(233, 30, 99, 0.2);
  }

  .countdown {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .time-box {
    background: linear-gradient(145deg, #fff, #ffe0ec);
    border-radius: 20px;
    padding: 18px 8px;
    box-shadow: 0 6px 15px rgba(233, 30, 99, 0.2), inset 0 -3px 0 rgba(233, 30, 99, 0.1);
    border: 2px solid #fff;
    transition: transform 0.3s;
  }
  .time-box:hover { transform: translateY(-5px) scale(1.05); }
  .time-box .num {
    font-size: 2.4rem;
    font-weight: 700;
    color: #d81b60;
    line-height: 1;
    font-family: 'Quicksand', sans-serif;
  }
  .time-box .label {
    font-size: 0.8rem;
    color: #ad1457;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 6px;
    font-weight: 600;
  }

  .seconds-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 25px;
  }

  .age-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ff4081, #e91e63);
    color: #fff;
    padding: 10px 25px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 1.1rem;
    box-shadow: 0 6px 18px rgba(233, 30, 99, 0.4);
    margin-bottom: 15px;
  }
  .age-badge .age-num {
    font-size: 1.8rem;
    margin: 0 5px;
    font-family: 'Pacifico', cursive;
  }

  .birthday-msg {
    display: none;
    animation: popIn 0.6s ease-out;
  }
  .birthday-msg h2 {
    font-family: 'Pacifico', cursive;
    font-size: 2.2rem;
    color: #e91e63;
    margin-bottom: 15px;
    text-shadow: 2px 2px 0 #fff;
  }
  .birthday-msg p {
    color: #880e4f;
    font-size: 1.1rem;
    font-weight: 600;
    line-height: 1.6;
  }

  #confettiCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 100;
  }

  .footer {
    margin-top: 20px;
    color: #ad1457;
    font-size: 0.85rem;
    font-weight: 600;
  }

  @media (max-width: 480px) {
    h1 { font-size: 2rem; }
    .time-box .num { font-size: 1.8rem; }
    .kitty { width: 120px; height: 120px; }
  }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div class="container">
  <!-- Hello Kitty SVG -->
  <svg class="kitty" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Kulaklar -->
    <polygon points="40,60 55,20 80,55" fill="#fff" stroke="#333" stroke-width="2"/>
    <polygon points="160,60 145,20 120,55" fill="#fff" stroke="#333" stroke-width="2"/>
    <!-- Yüz -->
    <ellipse cx="100" cy="110" rx="75" ry="65" fill="#fff" stroke="#333" stroke-width="2"/>
    <!-- Sol göz -->
    <ellipse cx="75" cy="105" rx="5" ry="8" fill="#222"/>
    <!-- Sağ göz -->
    <ellipse cx="125" cy="105" rx="5" ry="8" fill="#222"/>
    <!-- Burun -->
    <ellipse cx="100" cy="120" rx="5" ry="3.5" fill="#f9a825"/>
    <!-- Bıyıklar -->
    <line x1="30" y1="115" x2="60" y2="120" stroke="#333" stroke-width="1.5"/>
    <line x1="30" y1="125" x2="60" y2="125" stroke="#333" stroke-width="1.5"/>
    <line x1="30" y1="135" x2="60" y2="130" stroke="#333" stroke-width="1.5"/>
    <line x1="170" y1="115" x2="140" y2="120" stroke="#333" stroke-width="1.5"/>
    <line x1="170" y1="125" x2="140" y2="125" stroke="#333" stroke-width="1.5"/>
    <line x1="170" y1="135" x2="140" y2="130" stroke="#333" stroke-width="1.5"/>
    <!-- Fiyonk -->
    <ellipse cx="155" cy="45" rx="18" ry="12" fill="#e91e63" stroke="#ad1457" stroke-width="1.5"/>
    <ellipse cx="175" cy="45" rx="18" ry="12" fill="#e91e63" stroke="#ad1457" stroke-width="1.5"/>
    <circle cx="165" cy="45" r="5" fill="#ad1457"/>
    <circle cx="165" cy="45" r="2" fill="#fff"/>
  </svg>

  <h1>Sude Melek Nur</h1>
  <div class="subtitle">
    <span>🎀 23 Mart 2007 🎀</span>
  </div>

  <div id="countdownSection">
    <div class="age-badge">
      <span class="age-num" id="ageNum">--</span> yaşına giriyor!
    </div>

    <div class="countdown">
      <div class="time-box"><div class="num" id="years">00</div><div class="label">Yıl</div></div>
      <div class="time-box"><div class="num" id="months">00</div><div class="label">Ay</div></div>
      <div class="time-box"><div class="num" id="days">00</div><div class="label">Gün</div></div>
    </div>
    <div class="seconds-row">
      <div class="time-box"><div class="num" id="hours">00</div><div class="label">Saat</div></div>
      <div class="time-box"><div class="num" id="minutes">00</div><div class="label">Dakika</div></div>
      <div class="time-box"><div class="num" id="seconds">00</div><div class="label">Saniye</div></div>
    </div>

    <div class="footer">🌸 Doğum gününe kalan süre 🌸</div>
  </div>

  <div class="birthday-msg" id="birthdayMsg">
    <h2>🎉 İyi Ki Doğdun Sude Melek Nur! 🎉</h2>
    <p>Bu özel günün sana mutluluk, neşe ve bol bol Hello Kitty kadar tatlı anılar getirsin! 🎂🎀💖</p>
  </div>
</div>

<script>
  // Yüzen kalpler ve fiyonklar
  const emojis = ['🎀', '💖', '🌸', '💗', '🎂', '✨', '🎈', '💝'];
  function createFloating() {
    const el = document.createElement('div');
    el.className = 'floating';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (Math.random() * 5 + 6) + 's';
    el.style.fontSize = (Math.random() * 16 + 18) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 12000);
  }
  setInterval(createFloating, 500);
  for (let i = 0; i < 10; i++) setTimeout(createFloating, i * 200);

  // Geri sayım
  const birthDate = new Date(2007, 2, 23); // 23 Mart 2007

  function getNextBirthday() {
    const now = new Date();
    let year = now.getFullYear();
    let next = new Date(year, 2, 23); // 23 Mart bu yıl
    if (next < now) {
      next = new Date(year + 1, 2, 23);
    }
    return next;
  }

  function calculateAge() {
    const now = new Date();
    let age = now.getFullYear() - birthDate.getFullYear();
    const m = now.getMonth() - birthDate.getMonth();
    if (m < 0 || (m === 0 && now.getDate() < birthDate.getDate())) age--;
    return age + 1; // bir sonraki yaş
  }

  function updateCountdown() {
    const now = new Date();
    const next = getNextBirthday();
    const diff = next - now;

    // Doğum günü günü mü?
    if (now.getMonth() === 2 && now.getDate() === 23) {
      document.getElementById('countdownSection').style.display = 'none';
      const msg = document.getElementById('birthdayMsg');
      msg.style.display = 'block';
      startConfetti();
      return;
    }

    document.getElementById('ageNum').textContent = calculateAge();

    // Yıl, ay, gün hesapla
    let years = next.getFullYear() - now.getFullYear();
    let months = next.getMonth() - now.getMonth();
    let days = next.getDate() - now.getDate();
    let hours = next.getHours() - now.getHours();
    let minutes = next.getMinutes() - now.getMinutes();
    let seconds = next.getSeconds() - now.getSeconds();

    if (seconds < 0) { seconds += 60; minutes--; }
    if (minutes < 0) { minutes += 60; hours--; }
    if (hours < 0) { hours += 24; days--; }
    if (days < 0) {
      const prevMonth = new Date(next.getFullYear(), next.getMonth(), 0);
      days += prevMonth.getDate();
      months--;
    }
    if (months < 0) { months += 12; years--; }

    document.getElementById('years').textContent = String(years).padStart(2, '0');
    document.getElementById('months').textContent = String(months).padStart(2, '0');
    document.getElementById('days').textContent = String(days).padStart(2, '0');
    document.getElementById('hours').textContent = String(hours).padStart(2, '0');
    document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
    document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  // Konfeti efekti
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  let confettiPieces = [];
  let confettiActive = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const colors = ['#e91e63', '#ff4081', '#f8bbd0', '#fff', '#ffc1d9', '#ad1457', '#ffeb3b', '#ff5252'];

  function createConfetti() {
    confettiPieces = [];
    for (let i = 0; i < 200; i++) {
      confettiPieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        r: Math.random() * 8 + 4,
        d: Math.random() * 5 + 2,
        color: colors[Math.floor(Math.random() * colors.length)],
        tilt: Math.random() * 10 - 10,
        tiltAngle: 0,
        tiltAngleIncremental: Math.random() * 0.08 + 0.04,
        shape: Math.random() > 0.5 ? 'circle' : 'rect'
      });
    }
  }

  function drawConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confettiPieces.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      if (p.shape === 'circle') {
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      } else {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.tilt * Math.PI / 180);
        ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r * 1.5);
        ctx.restore();
      }
      ctx.fill();
    });
    updateConfetti();
  }

  function updateConfetti() {
    confettiPieces.forEach(p => {
      p.tiltAngle += p.tiltAngleIncremental;
      p.y += p.d;
      p.x += Math.sin(p.tiltAngle) * 2;
      p.tilt = Math.sin(p.tiltAngle) * 15;
      if (p.y > canvas.height) {
        p.y = -10;
        p.x = Math.random() * canvas.width;
      }
    });
  }

  function animateConfetti() {
    if (!confettiActive) return;
    drawConfetti();
    requestAnimationFrame(animateConfetti);
  }

  function startConfetti() {
    confettiActive = true;
    createConfetti();
    animateConfetti();
    // 15 saniye sonra durdur
    setTimeout(() => { confettiActive = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }, 15000);
  }
</script>

</body>
  </html>
